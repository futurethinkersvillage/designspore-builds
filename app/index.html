<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SculptGen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #14171c; --panel: #1c2129; --line: #2b323d;
    --text: #e8e4da; --dim: #8a93a1; --accent: #e8a84c; --bad: #e05252;
  }
  * { box-sizing: border-box; margin: 0; }
  body { display: flex; height: 100vh; background: var(--bg); color: var(--text);
         font: 13px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #panel { width: 300px; min-width: 300px; background: var(--panel);
           border-right: 1px solid var(--line); padding: 14px 16px;
           display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  h1 { font-size: 17px; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 11.5px; }
  .card { background: #171b22; border: 1px solid var(--line); border-radius: 8px;
          padding: 10px 12px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
             color: var(--dim); margin-bottom: 7px; }
  .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .row b { font-weight: 600; }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px;
          margin-right: 7px; }
  button { background: #262d38; color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 7px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  .btnrow { display: flex; gap: 8px; }
  .btnrow button { flex: 1; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #issues { color: #d9b16a; font-size: 12px; white-space: pre-wrap; }
  #err { display: none; background: #3a1d1d; border: 1px solid var(--bad);
         color: #f0c0c0; border-radius: 8px; padding: 10px 12px;
         font-family: Consolas, monospace; font-size: 11px;
         white-space: pre-wrap; max-height: 220px; overflow: auto; }
  #viewport { flex: 1; position: relative; }
  #viewport canvas { display: block; }
  #hover { position: absolute; pointer-events: none; background: #000c;
           border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px;
           font-size: 12px; display: none; z-index: 5; }
  #status { position: absolute; right: 12px; bottom: 10px; color: var(--dim);
            font-size: 11px; }
  .hint { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<div id="panel">
  <div>
    <h1>Sculpt<span>Gen</span></h1>
    <div class="sub">generative fabrication artwork</div>
  </div>
  <div id="err"></div>
  <div class="card">
    <h2>Sculpture</h2>
    <div id="summary"></div>
  </div>
  <div class="card">
    <h2>Regions</h2>
    <div id="regions"></div>
  </div>
  <div class="card">
    <h2>View</h2>
    <label class="hint">Exploded view</label>
    <input type="range" id="explode" min="0" max="1" step="0.01" value="0">
    <div class="btnrow" style="margin-top:8px">
      <button id="regen">Regenerate</button>
      <button id="reseed">New seed</button>
    </div>
  </div>
  <div class="card">
    <h2>Issues</h2>
    <div id="issues">—</div>
  </div>
  <div class="hint">
    Edit <b>design.json</b> (e.g. with Claude Code) — the view updates
    automatically. Middle-drag pan · Shift+middle orbit · wheel zoom.
  </div>
</div>
<div id="viewport">
  <div id="hover"></div>
  <div id="status"></div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js",
               "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
